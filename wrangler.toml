name = "webapps"
main = "worker.js"
compatibility_date = "2024-09-23"

# 靜態網站資源 (原 Cloudflare Pages 內容)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 綁定 Cloudflare D1 資料庫
[[d1_databases]]
binding = "DB"
database_name = "webapps-db"
database_id = "PLACEHOLDER_DATABASE_ID" # 執行 wrangler d1 create 後會自動填入
